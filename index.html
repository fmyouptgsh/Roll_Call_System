<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>課堂點名系統</title>
    <style>
        /* 網頁樣式 (可自行調整) */
        body { font-family: '微軟正黑體', sans-serif; text-align: center; margin-top: 30px; }
        #students-container { 
            display: flex; 
            flex-wrap: wrap; 
            justify-content: center; 
            gap: 12px; 
            max-width: 800px;
            margin: 20px auto;
        }
        .student-button {
            padding: 10px 15px;
            font-size: 16px;
            cursor: pointer;
            border: 1px solid #007BFF;
            border-radius: 5px;
            background-color: #f8f9fa;
            color: #007BFF;
            transition: all 0.2s;
            min-width: 100px; /* 確保按鈕大小一致 */
        }
        .student-button:hover:not(.checked) { 
            background-color: #007BFF; 
            color: white; 
        }
        .checked {
            background-color: #28a745 !important; /* 綠色 */
            color: white;
            cursor: not-allowed;
            border-color: #28a745;
        }
    </style>
</head>
<body>

    <h1>請點選您的姓名以完成點名</h1>
    <div id="students-container">
        載入學生名單中...
    </div>

    <script>
        // *** 🚨 替換成您自己的 Apps Script 部署 URL 🚨 ***
        const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbww3hxndPjluSGrqdBR7EIT0mSZv0m8cHR494trZbhIqP087dF7EsVLGGAc1Nn29AQOOg/exec';

        // 載入名單
        async function loadStudents() {
            const container = document.getElementById('students-container');
            container.innerHTML = '<p>讀取 Google 試算表名單...</p>';

            try {
                // 發送 GET 請求給 Apps Script
                const response = await fetch(WEB_APP_URL);
                const students = await response.json();

                if (students.status === 'error') {
                     container.innerHTML = `<p style="color:red;">載入名單失敗：${students.message}</p>`;
                     return;
                }

                container.innerHTML = ''; // 清空載入訊息

                // 為每個學生建立一個按鈕
                students.forEach(student => {
                    const button = document.createElement('button');
                    button.className = 'student-button';
                    button.textContent = student.name;
                    button.dataset.id = student.id; 
                    button.onclick = () => checkIn(button, student.id, student.name);
                    container.appendChild(button);
                    
                    // 檢查瀏覽器會話儲存，若已點名則直接標記
                    if (sessionStorage.getItem(`checked_${student.id}`) === 'true') {
                        button.textContent = `${student.name} (已點名)`;
                        button.classList.add('checked');
                        button.disabled = true;
                    }
                });

            } catch (error) {
                container.innerHTML = `<p style="color:red;">載入名單失敗：請檢查 Apps Script 是否正確部署及授權 (錯誤: ${error.message})</p>`;
                console.error('Fetch error:', error);
            }
        }

        // 處理點名 (POST 請求)
        async function checkIn(button, studentId, studentName) {
            if (button.classList.contains('checked')) {
                return;
            }

            const originalText = button.textContent;
            button.textContent = '點名中...';
            button.disabled = true;

            try {
                // 發送 POST 請求給 Apps Script，將學號傳輸過去
                const response = await fetch(WEB_APP_URL, {
                    method: 'POST',
                    mode: 'no-cors', // 必須使用 no-cors 來與 Apps Script 互動
                    body: JSON.stringify({ id: studentId }) 
                });

                // 因為是 no-cors，我們無法直接讀取回應內容，但通常請求發出即視為成功
                
                // 更新按鈕狀態：顯示已點名
                button.textContent = `${studentName} (已點名)`;
                button.classList.add('checked');
                // 使用 sessionStorage 記錄，避免學生在同一瀏覽器重複點名
                sessionStorage.setItem(`checked_${studentId}`, 'true');

                console.log(`Student ${studentId} checked in successfully (via no-cors).`);

            } catch (error) {
                // 失敗時恢復按鈕狀態
                alert('點名失敗，請檢查網路或通知老師。');
                button.textContent = originalText;
                button.disabled = false;
                console.error('Check-in error:', error);
            }
        }

        // 網頁載入後執行
        window.onload = loadStudents;
    </script>

</body>
</html>

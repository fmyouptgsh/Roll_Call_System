<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <title>課堂點名系統</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 50px;
        }

        #students-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
        }

        .student-button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            border: 1px solid #ccc;
            border-radius: 5px;
            background-color: #f0f0f0;
            transition: background-color 0.3s;
            min-width: 100px;
        }

        .student-button:hover:not(.checked) {
            background-color: #e0e0e0;
        }

        .checked {
            background-color: #4CAF50 !important;
            color: white;
            cursor: not-allowed;
            border-color: #4CAF50;
        }
    </style>
</head>

    
<body>

    <!-- 下拉選單 -->
    <select id="classSelector"></select>
    <button onclick="loadStudents()">載入名單</button>

    <div id="students-container"></div>

    <script>
        // 🚨 替換成您自己的 Apps Script 部署 URL 🚨
        const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycby9ledoJh35JikP7EfxMoO0cub-Kal4rILUleaBExQIQ2rJdvBR0eSBnwocHdz-ux65ZQ/exec';

        const CLASS_OPTIONS = [
            { name: "--- 請選擇課程 ---", id: "" },
            { name: "114-1 進階程式設計-高二社會組", id: "1GcGA5J2yKtjlWofH543McS6zUpnzHiTN2myDTRwCdmc" },
            { name: "114-1 進階程式設計-210", id: "11Cg36AQT2CnhRI1NTu5Zv__bJm7mI9FMNn0UiYWj7xg" }
        ];

        function getApiUrl(ssid) {
            return `${WEB_APP_URL}?ssid=${ssid}`;
        }

        function populateClassSelector() {
            const selector = document.getElementById('classSelector');
            CLASS_OPTIONS.forEach(c => {
                const option = document.createElement('option');
                option.value = c.id;
                option.textContent = c.name;
                selector.appendChild(option);
            });
        }

        async function loadStudents() {
            const selector = document.getElementById('classSelector');
            const ssId = selector.value;
            const container = document.getElementById('students-container');

            if (!ssId) {
                alert('請先選擇課程！');
                container.innerHTML = '請選擇課程後點擊載入。';
                return;
            }

            container.innerHTML = '<p>讀取中...</p>';

            const response = await fetch(getApiUrl(ssId));
            const students = await response.json();

            container.innerHTML = '';

            students.forEach(student => {
                const btn = document.createElement('button');
                btn.className = 'student-button';
                btn.textContent = student.name;
                btn.onclick = () => checkIn(btn, student.id, student.name, ssId);

                container.appendChild(btn);
            });
        }

        async function checkIn(button, studentId, studentName, ssId) {
            if (button.classList.contains('checked')) return;

            const original = button.textContent;
            button.textContent = "點名中...";
            button.disabled = true;

            try {
                const response = await fetch(getApiUrl(ssId), {
                    method: 'POST',
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ id: studentId, name: studentName })
                });

                const result = await response.json();

                if (result.status !== "success") {
                    throw new Error(result.message);
                }

                button.textContent = `${studentName} (已點名)`;
                button.classList.add('checked');

            } catch (err) {
                alert("點名失敗：" + err.message);
                button.textContent = original;
                button.disabled = false;
            }
        }

        window.onload = populateClassSelector;
    </script>

</body>

</html>
